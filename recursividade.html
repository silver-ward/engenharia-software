<!DOCTYPE html>
<html>
    <head>
        <title>Recursividade</title>
        <meta charset="UTF-8">
        <script>

            function fatorial(x){
                if(x <= 1){
                    return 1
                }
                return x * fatorial(x - 1);
            }

            console.log(fatorial(5));

        </script>
    </head>
