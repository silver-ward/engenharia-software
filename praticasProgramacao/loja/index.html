<!DOCTYPE html>
<html>

<head>
    <title>Lojinha</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/bootstrap-icons.css">
    
    <link rel="stylesheet" href="./css/style.css">
    
    <script src="./js/funcoes.js"></script>
</head>

<body>
    <div class="container">
        <h1>Lojinha da Unidade</h1>

        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Imagem</th>
                    <th width="150em">Produto</th>
                    <th width="80em">Preço Unitário</th>
                    <th width="100em">Qtd</th>
                    <th width="100em">Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <img src="./img/produto-1.webp" alt="Produto 1" width="200">
                    </td>
                    <td>
                        <div>Celular Samsung</div>
                        <div><span class="produto-item">Código:</span> 123456</div>
                        <div><span class="produto-item">Cor:</span> Preto</div>
                    </td>
                    <td id="valor-1">1000</td>
                    <td>
                        <span class="badge text-bg-danger" onclick="alterarQtd(1, '-')">
                            <i class="bi bi-dash"></i>
                        </span>
                        <span id="qtd-1" class="qtd">
                            0
                        </span>
                        <span class="badge text-bg-success" onclick="alterarQtd(1, '+')">
                            <i class="bi bi-plus"></i>
                        </span>
                    </td>
                    <td>
                        <span class="cifrao">R$</span>
                        <span id="total-1">0</span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <img src="./img/produto-2.webp" alt="Produto 2" width="200">
                    </td>
                    <td>
                        <div>Computador AMD</div>
                        <div><span class="produto-item">Código:</span> 234567</div>
                        <div><span class="produto-item">Cor:</span> Preto</div>
                    </td>
                    <td id="valor-2">3000</td>
                    <td>
                        <span class="badge text-bg-danger" onclick="alterarQtd(2, '-')">
                            <i class="bi bi-dash"></i>
                        </span>
                        <span id="qtd-2" class="qtd">
                            0
                        </span>
                        <span class="badge text-bg-success" onclick="alterarQtd(2, '+')">
                            <i class="bi bi-plus"></i>
                        </span>
                    </td>
                    <td>
                        <span class="cifrao">R$</span>
                        <span id="total-2">0</span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <img src="./img/produto-3.webp" alt="Produto 3" width="200">
                    </td>
                    <td>
                        <div>Televisão</div>
                        <div><span class="produto-item">Código:</span> 345678</div>
                        <div><span class="produto-item">Cor:</span> Preto</div>
                    </td>
                    <td id="valor-3">3000</td>
                    <td>
                        <span class="badge text-bg-danger" onclick="alterarQtd(3, '-')">
                            <i class="bi bi-dash"></i>
                        </span>
                        <span id="qtd-3" class="qtd">
                            0
                        </span>
                        <span class="badge text-bg-success" onclick="alterarQtd(3, '+')">
                            <i class="bi bi-plus"></i>
                        </span>
                    </td>
                    <td>
                        <span class="cifrao">R$</span>
                        <span id="total-3">0</span>
                    </td>
                </tr>
            </tbody>
        </table>

        <footer class="text-center">
            <i class="bi bi-cart-check"></i>
            Subtotal: 
            <span class="cifrao">R$</span>
            <span id="subtotal">0</span>
        </footer>

    </div>
</body>

</html>
